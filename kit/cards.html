  .sheet { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 68mm; gap: 2mm; width: 194mm; }
  .card { background: #15181f; color: #edeff4; border-radius: 4mm; padding: 4mm 4mm 0; display: grid;

  .card .en { color: #8d96a8; }
  .qr { background: #fff; border-radius: 2.5mm; padding: 2mm; align-self: start; margin-top: 1mm; }
  .qr img { width: 100%; display: block; }
  .url { grid-column: 2; text-align: center; font-size: 7.4pt; font-weight: 700; color: #edeff4; margin-top: -1mm; }
  .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 2.2mm; display: flex; }
  .stripe i { flex: 1; }
</style></head><body>
