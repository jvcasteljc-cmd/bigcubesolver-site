<style>
  @page { size: letter; margin: 6mm 7mm; }
  * { box-sizing: border-box; }

  .sheet { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 65mm; gap: 2mm; width: 201mm; }
  .card { background: #15181f; color: #edeff4; border-radius: 4mm; padding: 4mm 4mm 0; display: grid;

  .card p { margin: 0 0 0.8mm; font-size: 7.6pt; line-height: 1.3; color: #c9cfdb; }
  .card .en { color: #8d96a8; }
  .qr { background: #fff; border-radius: 2.5mm; padding: 2mm; align-self: start; margin-top: 1mm; }
  .qr img { width: 100%; display: block; }
  .url { grid-column: 2; text-align: center; font-size: 7.4pt; font-weight: 700; color: #edeff4; margin-top: -1mm; }
  /* the community strip (Discord), under both columns; it points at the
     site's /community, never at the invite, so a new invite needs no reprint */
  .comm { grid-column: 1 / 3; display: flex; align-items: center; gap: 3mm;
    border-top: 0.3mm solid #2c323f; padding: 1.3mm 0 3.2mm; }
  .comm .qr { width: 14.5mm; padding: 1mm; border-radius: 1.5mm; margin: 0; flex: none; }
  .comm b { display: block; font-size: 8.4pt; color: #ffd400; line-height: 1.2; }
  .comm span { display: block; font-size: 7pt; color: #c9cfdb; line-height: 1.22; }
  .comm .en { color: #8d96a8; }
  .comm .u { font-weight: 700; color: #edeff4; }
  .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 2.2mm; display: flex; }
  .stripe i { flex: 1; }
</style></head><body>
