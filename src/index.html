<!doctype html>
<html lang="en">
<head>
{{HEAD}}
<title t="home.title"></title>
<meta name="description" content="Android app: scan any cube from 2×2 to 15×15 with the camera and follow a short solution on a 3D cube. Picture cubes, patterns, smart cubes. No ads, no account.">
<meta property="og:title" content="Big Cube Solver - every cube from 2×2 to 15×15">
<meta property="og:description" content="Scan it, solve it, follow it - every size up to 15×15.">
<meta property="og:image" content="https://bigcubesolver.com/img/og.png">
<meta property="og:url" content="https://bigcubesolver.com/">
</head>
<body>
{{HEADER:home}}
<main>
  <div class="hero wrap">
    <img class="logo" src="/img/logo.webp" alt="Big Cube Solver" width="720" height="481">
    <h1 t="home.h1"></h1>
    <p class="lead" t="home.lead"></p>
    <a class="btn primary" href="#get"><span t="home.get"></span></a>
    <a class="btn ghost" href="/patterns"><span t="home.browse"></span></a>
    <div class="soon"><span t="home.soon"></span></div>
  </div>

  <section>
    <div class="wrap">
      <h2 t="home.what.h"></h2>
      <p class="sub" t="home.what.sub"></p>
      <div class="features">
        <div class="feature"><img src="/img/01-big-cubes.webp" alt="" loading="lazy" width="540" height="960"><div><h3 t="home.f1.t"></h3><p t="home.f1.d"></p></div></div>
        <div class="feature"><img src="/img/02-follow.webp" alt="" loading="lazy" width="540" height="960"><div><h3 t="home.f2.t"></h3><p t="home.f2.d"></p></div></div>
        <div class="feature"><img src="/img/03-picture-cubes.webp" alt="" loading="lazy" width="540" height="960"><div><h3 t="home.f3.t"></h3><p t="home.f3.d"></p></div></div>
        <div class="feature"><img src="/img/04-own-colours.webp" alt="" loading="lazy" width="540" height="960"><div><h3 t="home.f4.t"></h3><p t="home.f4.d"></p></div></div>
        <div class="feature"><img src="/img/05-patterns.webp" alt="" loading="lazy" width="540" height="960"><div><h3 t="home.f5.t"></h3><p t="home.f5.d"></p></div></div>
        <div class="feature"><img src="/img/06-design.webp" alt="" loading="lazy" width="540" height="960"><div><h3 t="home.f6.t"></h3><p t="home.f6.d"></p></div></div>
        <div class="feature"><img src="/img/07-every-cube.webp" alt="" loading="lazy" width="540" height="960"><div><h3 t="home.f8.t"></h3><p t="home.f8.d"></p></div></div>
        <div class="feature"><img src="/img/08-smart-skins.webp" alt="" loading="lazy" width="540" height="960"><div><h3 t="home.f7.t"></h3><p t="home.f7.d"></p></div></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="promise">
        <h2 t="home.novid.h"></h2>
        <p t="home.novid.d"></p>
        <p class="wysiwyg" t="home.novid.w"></p>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 t="home.turns.h"></h2>
      <p class="sub" t="home.turns.sub"></p>
      <div class="turns">
        <div><b>~19</b><span t="home.turns.3"></span></div>
        <div><b>~43</b><span>4×4</span></div>
        <div><b>~69</b><span>5×5</span></div>
        <div><b>~200</b><span>7×7</span></div>
        <div><b>~620</b><span>10×10</span></div>
        <div><b t="home.turns.15n"></b><span>15×15</span></div>
      </div>
    </div>
  </section>

  <section id="get">
    <div class="wrap">
      <h2 t="home.tiers.h"></h2>
      <p class="sub" t="home.tiers.sub"></p>
      <div class="tiers">
        <div class="tier"><h3 t="home.free.h"></h3><div class="what">2×2, 3×3, 4×4</div><p t="home.free.d"></p></div>
        <div class="tier"><h3 t="home.t10.h"></h3><div class="what"><span t="home.once"></span></div><p t="home.t10.d"></p></div>
        <div class="tier"><h3 t="home.t15.h"></h3><div class="what"><span t="home.once"></span></div><p t="home.t15.d"></p></div>
      </div>
      <p class="soon" t="home.testing"></p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 t="home.real.h"></h2>
      <ul class="checks">
        <li t="home.real.1"></li>
        <li t="home.real.2"></li>
        <li t="home.real.3"></li>
        <li t="home.real.4"></li>
        <li t="home.real.5"></li>
        <li t="home.real.6"></li>
      </ul>
      <p style="margin-top:24px" t="num.home"></p>
      <p style="margin-top:20px"><a class="btn ghost" href="/faq"><span t="home.qa"></span></a>
        <a class="btn ghost" href="/support"><span t="nav.support"></span></a></p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 t="home.comm.h"></h2>
      <p class="sub" t="home.comm.d"></p>
      <p><a class="btn primary" href="{{DISCORD}}" target="_blank" rel="noopener"><span t="com.join"></span></a>
        <a class="btn ghost" href="/community"><span t="nav.community"></span></a></p>
    </div>
  </section>
</main>
{{FOOTER}}
</body>
</html>
