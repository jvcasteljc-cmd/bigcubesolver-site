<!doctype html>
<html lang="en">
<head>
{{HEAD}}
<title t="pat.title"></title>
<meta name="description" content="Patterns for every cube from 2×2 to 15×15. Tap one on your phone to add it to Big Cube Solver.">
</head>
<body>
{{HEADER:patterns}}
<main>
  <div class="hero slim"><img class="logo" src="/img/logo.webp" alt="Big Cube Solver" width="720" height="481"></div>
  <section>
    <div class="wrap">
      <h2 t="pat.h"></h2>
      <p class="sub" t="pat.sub"></p>
      <div class="chips" id="sizes" role="group" aria-label="Cube size"></div>
      <div class="grid" id="grid"></div>
      <p class="note" id="status"></p>
    </div>
  </section>
</main>
{{FOOTER}}
{{JS:pat.js.}}
<script src="/js/cube.js"></script>
<script src="/js/draw.js"></script>
<script>
(function () {
  var sizesEl = document.getElementById('sizes'), grid = document.getElementById('grid'), status = document.getElementById('status');
  var all = [], current = 0;
  function show(n) {
    current = n;
    try { history.replaceState(null, '', '/patterns?size=' + n); } catch (e) {}
    Array.prototype.forEach.call(sizesEl.children, function (b) { b.setAttribute('aria-pressed', String(+b.dataset.n === n)); });
    var list = all.filter(function (p) { return p.n === n; });
    grid.innerHTML = '';
    list.forEach(function (p) {
      var a = document.createElement('a');
      a.className = 'pcard';
      a.href = BcsDraw.link(p.n, p.name, p.m);
      var pic;
      try { pic = BcsDraw.svg(p.n, BcsCube.apply(p.n, p.m)); } catch (e) { pic = ''; }
      a.innerHTML = pic + '<span>' + BcsDraw.esc(p.name) + '</span><small>' + p.n + '×' + p.n + '</small>';
      grid.appendChild(a);
    });
    status.innerHTML = BcsLang.t('pat.js.count', { n: list.length });
  }
  fetch('/patterns.json').then(function (r) { return r.json(); }).then(function (data) {
    all = data.patterns;
    var sizes = [];
    all.forEach(function (p) { if (sizes.indexOf(p.n) < 0) sizes.push(p.n); });
    sizes.sort(function (a, b) { return a - b; });
    sizes.forEach(function (n) {
      var b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.dataset.n = n; b.textContent = n + '×' + n;
      b.onclick = function () { show(n); };
      sizesEl.appendChild(b);
    });
    var want = +(new URLSearchParams(location.search).get('size'));
    show(sizes.indexOf(want) >= 0 ? want : sizes[0]);
  }).catch(function () { status.innerHTML = BcsLang.t('pat.js.fail'); });
})();
</script>
</body>
</html>
